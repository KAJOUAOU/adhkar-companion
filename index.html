    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Qu'est-ce que les adhkar du matin et du soir ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les adhkar du matin (أذكار الصباح) et du soir (أذكار المساء) sont des invocations islamiques que le Prophète Muhammad ﷺ récitait chaque jour pour commencer et terminer sa journée. Ils comprennent des versets coraniques (Ayat Al-Kursi, Al-Ikhlas, Al-Falaq, An-Nas, Al-Baqarah 285-286) et des formules de dhikr authentiques transmises dans les hadiths de Bukhari, Muslim et autres."
          }
        },
        {
          "@type": "Question",
          "name": "Quand réciter les adhkar du matin ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les adhkar du matin se récitent après la prière de Fajr (l'aube) jusqu'au lever du soleil (Dhuha). La période idéale est entre la prière de Fajr et environ une heure après le lever du soleil. Il est recommandé de les réciter assis, tourné vers la Qibla, dans un état de pureté."
          }
        },
        {
          "@type": "Question",
          "name": "Quand réciter les adhkar du soir ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les adhkar du soir se récitent à partir de la prière de Asr (l'après-midi) jusqu'à la nuit tombée (Maghrib). Certains savants permettent de les réciter jusqu'à la prière d'Isha. Il est préférable de ne pas les retarder après le coucher du soleil."
          }
        },
        {
          "@type": "Question",
          "name": "Combien y a-t-il d'adhkar dans l'application ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Adhkar Companion contient 32 invocations authentiques pour les adhkar du matin et du soir, basées sur le livre \"Mes invocations du matin et du soir\" de Quran Time Institut. Chaque dhikr est accompagné du texte arabe avec tajweed coloré, de la translittération et de la traduction en français."
          }
        },
        {
          "@type": "Question",
          "name": "Les adhkar de cette application sont-ils authentiques ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Tous les adhkar proviennent de hadiths authentiques (sahih) ou bons (hasan) tirés des recueils de Bukhari, Muslim, Abu Dawud, At-Tirmidhi, Ibn Maja et Al-Hakim, vérifiés par Al-Albani. Les textes arabes suivent la riwaya de Hafs 'an 'Asim."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne le streak de dhikr ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le streak comptabilise le nombre de jours consécutifs où vous avez complété vos adhkar du matin ou du soir. Chaque jour où vous terminez au moins une session (matin ou soir), votre streak augmente de 1. Il se remet à zéro si vous sautez un jour complet."
          }
        },
        {
          "@type": "Question",
          "name": "L'application fonctionne-t-elle sans connexion internet ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Adhkar Companion est une Progressive Web App (PWA) installable sur votre téléphone. Une fois chargée, elle fonctionne entièrement hors ligne. Vos données (streak, favoris, progression) sont sauvegardées localement sur votre appareil."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que le tajweed coloré ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le tajweed coloré est un système de couleurs qui met en évidence les règles de tajweed (prononciation correcte du Coran) directement dans le texte arabe. Chaque couleur correspond à une règle : ghunna, ikhfa, idgham, qalqala, madd, etc. Cela aide à réciter correctement selon la riwaya de Hafs."
          }
        }
      ]
    }

      <div style="font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333;">
        <h1>Adhkar Companion — Application islamique de dhikr quotidien</h1>
        <p>Récitez vos <strong>adhkar du matin et du soir</strong> selon la Sunnah du Prophète ﷺ. 32 invocations authentiques avec tajweed coloré, compteur de dhikr et streak de constance. 100% gratuit.</p>

        <h2>Adhkar du matin (أذكار الصباح)</h2>
        <p>Les invocations du matin incluent : Ayat Al-Kursi, Sourate Al-Ikhlas (3×), Al-Falaq (3×), An-Nas (3×), Al-Baqarah versets 285-286, la Sayyid Al-Istighfar, le tasbih (SubhanAllah 33×, Alhamdulillah 33×, Allahu Akbar 34×) et bien d'autres formules de protection et de gratitude.</p>

        <h2>Adhkar du soir (أذكار المساء)</h2>
        <p>Les mêmes invocations sont recommandées le soir, récitées après la prière de Asr jusqu'au Maghrib. Elles incluent notamment la formule "Asbahna wa asbahal mulku lillah" remplacée par "Amsayna wa amsal mulku lillah" pour le soir.</p>

        <h2>Fonctionnalités</h2>
        <ul>
          <li>32 adhkar authentiques (Bukhari, Muslim, Abu Dawud, At-Tirmidhi)</li>
          <li>Texte arabe avec tajweed coloré (riwaya Hafs)</li>
          <li>Translittération et traduction en français</li>
          <li>Compteur de dhikr avec vibration</li>
          <li>Streak de constance spirituelle</li>
          <li>Mode immersif plein écran</li>
          <li>Sunnah de la nuit (adhkar avant le sommeil)</li>
          <li>Takbir de l'Aïd avec audio</li>
          <li>Application hors ligne (PWA)</li>
        </ul>

        <h2>Sources islamiques</h2>
        <p>Tous les adhkar sont issus de hadiths authentiques (sahih) ou bons (hasan) des recueils de l'Imam Al-Bukhari, l'Imam Muslim, Abu Dawud, At-Tirmidhi, Ibn Maja et Al-Hakim, vérifiés par le Cheikh Al-Albani rahimahullah.</p>

        <p>Cette application nécessite JavaScript pour fonctionner pleinement. Veuillez activer JavaScript dans votre navigateur.</p>
